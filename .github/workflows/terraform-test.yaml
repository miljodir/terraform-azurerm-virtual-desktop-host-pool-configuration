name: Terraform and OpenTofu tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@94ad8ac2d2a0a5a9161a60f40a60dba541954289
    with:
      engine: both
      terraform-version: "1.x"
      opentofu-version: "1.13.9"
      prepare-script: scripts/prepare-test-module.sh
