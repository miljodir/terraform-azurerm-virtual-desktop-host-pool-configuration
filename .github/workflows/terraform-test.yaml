name: Terraform and OpenTofu tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: miljodir/workflow-templates/.github/workflows/terraform-test.yaml@70a3d807d7a6d1969f8216c8c9e3a5108e892ddb
    with:
      engine: both
      terraform-version: "1.x"
      opentofu-version: "1.13.9"
      prepare-script: scripts/prepare-test-module.sh
