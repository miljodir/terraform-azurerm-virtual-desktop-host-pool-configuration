name: Validate module

on:
  pull_request:
    paths:
      - "**.tf"
      - "scripts/**"
      - ".github/workflows/validate.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5.0"
          terraform_wrapper: false
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - name: Check FSLogix storage guardrail source contract
        shell: pwsh
        run: |
          $source = Get-Content fslogix.tf -Raw
          $account = [regex]::Match($source, '(?ms)^resource "azurerm_storage_account" "fslogix" \{.*?(?=^resource |\z)').Value
          $network = [regex]::Match($account, '(?ms)^  network_rules \{\r?\n(.*?)^  \}').Groups[1].Value
          $checks = @{
            'Deny-Storage-CopyScope' = $account -match '(?m)^  allowed_copy_scope\s*=\s*"AAD"\s*$'
            'Deny-Storage-LocalUser' = $account -match '(?m)^  local_user_enabled\s*=\s*false\s*$'
            'Deny-Storage-NetworkAclsBypass' = $network -match '(?m)^\s*bypass\s*=\s*\["None"\]\s*$'
            '34c877ad-507e-4c82-993e-3452a6e0ad3c' = $network -match '(?m)^\s*default_action\s*=\s*"Deny"\s*$'
            '2a1a9cdf-e04d-429a-8416-3bfb72a1b26f' = (
              $network -match '(?m)^\s*default_action\s*=\s*"Deny"\s*$' -and
              $network -match '(?m)^\s*ip_rules\s*=\s*\[\s*\]\s*$'
            )
            'No public subnet allow rules' = $network -match '(?m)^\s*virtual_network_subnet_ids\s*=\s*\[\s*\]\s*$'
            'Public network disabled' = $account -match '(?m)^  public_network_access_enabled\s*=\s*false\s*$'
            'Shared keys disabled' = $account -match '(?m)^  shared_access_key_enabled\s*=\s*false\s*$'
            'Premium FileStorage retained' = (
              $account -match '(?m)^  account_kind\s*=\s*"FileStorage"\s*$' -and
              $account -match '(?m)^  account_tier\s*=\s*"Premium"\s*$'
            )
            'Entra Kerberos retained' = $account -match '(?m)^\s*directory_type\s*=\s*"AADKERB"\s*$'
            'File private endpoint retained' = $source -match '(?m)^\s*subresource_names\s*=\s*\["file"\]\s*$'
          }
          foreach ($check in $checks.GetEnumerator()) {
            if (-not $check.Value) { throw "FSLogix storage contract failed: $($check.Key)" }
          }
      - name: Check opt-in defaults and rendered contract without Azure
        shell: pwsh
        env:
          TF_VAR_name: dsk
          TF_VAR_subscription_name: p-gis
          TF_VAR_subnet_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/network/providers/Microsoft.Network/virtualNetworks/avd/subnets/hosts
        run: |
          $result = 'var.fslogix == null && length(local.fslogix) == 0 && length(local.fslogix_admin_assignments) == 0 && var.hostconfig_provisioning_enabled == true && var.hostconfig_custom_configuration_script_url == null' | terraform console -no-color
          if ($LASTEXITCODE -ne 0 -or ($result | Out-String).Trim() -ne 'true') { throw "Default contract failed: $result" }
          $env:TF_VAR_fslogix = @{
            storage_account_name = 'pgisdskprofiles'
            private_endpoint_subnet_id = $env:TF_VAR_subnet_id
            private_dns_zone_id = '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/dns/providers/Microsoft.Network/privateDnsZones/privatelink.file.core.windows.net'
            create_resource_group = $false
            resource_group_name = 'p-gis-dsk-data'
            user_group_ids = @{ users = '11111111-1111-1111-1111-111111111111' }
            administrator_group_ids = @{ admins = '22222222-2222-2222-2222-222222222222' }
          } | ConvertTo-Json -Compress
          $expression = 'local.fslogix_enabled && length(local.fslogix) == 1 && length(local.fslogix_admin_assignments) == 3 && var.fslogix.storage_account_name == "pgisdskprofiles" && var.fslogix.replication_type == "ZRS" && local.vm_name_prefix == "pgisdsk" && local.fslogix_profile_path == "\\\\pgisdskprofiles.file.core.windows.net\\profiles" && length(regexall("__PROFILE_PATH__|__HOST_PREFIX_BASE64__|__CONTENT_VERSION__", local.fslogix_bootstrap_content)) == 0'
          $result = $expression | terraform console -no-color
          if ($LASTEXITCODE -ne 0 -or ($result | Out-String).Trim() -ne 'true') { throw "Enabled contract failed: $result" }
      - name: Parse canonical PowerShell bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/Set-FSLogixHost.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
